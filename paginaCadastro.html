<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <form>
        <!-- Nome -->
        <label>Nome Completo: </label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo"> <br>

        <!-- Data -->
        <label>Data de Nascimento: </label>
        <input type="date" id="data" name="data"> <br>

        <!-- CPF -->
        <label>CPF: </label>
        <input type="text" id="cpf" name="cpf" placeholder="Apenas números"> <br>

        <!-- Telefone -->
        <label>Telefone: </label>
        <input type="tel" id="telefone" name="telefone" placeholder="(19) 99999-9999"><br>

        <!-- E-mail -->
        <label>E-mail: </label>
        <input type="text" id="emial" name="email" placeholder="seu@email.com"><br>

        <!-- -->
        <p>Username: </p>
        <p>Senha: </p>
    </form>


</body>
</html>
